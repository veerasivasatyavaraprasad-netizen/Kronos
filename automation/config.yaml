# Kronos automation config.
# `python -m automation.kronos_auto run` forecasts every enabled symbol below and
# writes CSV / PNG / JSON / Markdown reports to `output_dir`.

model: kronos-small          # kronos-mini | kronos-small | kronos-base
# To forecast with a fine-tuned model (see `kronos_auto finetune`), uncomment:
# model_path: finetune_csv/finetuned/quick_cpu_ali09988/basemodel/best_model
# tokenizer_path: finetune_csv/finetuned/quick_cpu_ali09988/tokenizer/best_model
device: auto                 # auto | cpu | cuda:0 | mps
output_dir: outputs

defaults:
  lookback: 400              # history bars fed to the model (<= 512 for small/base, <= 2048 for mini)
  pred_len: 24               # bars to forecast
  temperature: 1.0
  top_p: 0.9
  sample_count: 5            # forecast paths; mean is reported, spread gives the band in the chart
  seed: 42

# Alerts after each run. Secrets (bot tokens, SMTP password, webhooks) go in environment
# variables / .env, never in this file -- see .env.example.
alerts:
  enabled: false
  channels: [telegram, email, discord, slack]   # only those with env vars set are used
  only_signals: []           # e.g. [UP, DOWN] to skip FLAT forecasts
  min_abs_change_pct: 0      # only alert when |forecast change| >= this
  attach_charts: true
  include_errors: true

# Auto-trading (long-only). Only symbols with a `trade_symbol` are traded.
# broker: paper  -> simulated account in outputs/paper_account.json (no money involved)
# broker: alpaca -> Alpaca paper account; real money ONLY if live: true AND env KRONOS_ALLOW_LIVE_TRADING=yes
trading:
  enabled: false
  broker: paper
  live: false
  dry_run: false             # true = log decisions without placing orders
  buy_threshold_pct: 1.0     # buy when forecast change >= +1%
  sell_threshold_pct: -1.0   # close position when forecast change <= -1%
  min_paths_agree_pct: 60    # and at least 60% of sampled paths agree
  order_notional: 1000       # money per buy order
  max_position_notional: 5000
  max_orders_per_run: 5
  max_data_age_hours: 48     # never trade on stale data
  starting_cash: 100000      # paper broker only

symbols:
  # --- Offline sample data shipped with the repo (always works) ---
  - name: SAMPLE_A_SHARE_5MIN
    source: csv
    path: data/sample_a_share_5min.csv

  # --- Live data (needs internet access to Yahoo Finance / Binance) ---
  - name: BTCUSDT_1H
    source: binance
    symbol: BTCUSDT
    interval: 1h
    limit: 1000
    trade_symbol: BTC/USD    # Alpaca crypto pair
    enabled: false

  - name: AAPL_1D
    source: yfinance
    symbol: AAPL
    interval: 1d
    period: 3y
    trade_symbol: AAPL
    enabled: false

  - name: SPX_1D
    source: yfinance
    symbol: ^GSPC
    interval: 1d
    period: 3y
    enabled: false
