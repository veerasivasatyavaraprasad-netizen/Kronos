<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronos - Sign in</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  form { background: #fff; padding: 32px; border-radius: 12px; width: 100%; max-width: 340px;
         box-shadow: 0 10px 30px rgba(0,0,0,.2); margin: 16px; }
  h1 { margin: 0 0 20px; font-size: 22px; color: #333; }
  label { display: block; font-size: 14px; color: #555; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
  button { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 6px; background: #667eea;
           color: #fff; font-size: 15px; cursor: pointer; }
  .error { background: #fdecea; color: #b42318; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<form method="post">
  <h1>🔮 Kronos</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
