name: CI

on:
  push:
  pull_request:

jobs:
  lunatrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install LunaTrade dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lunatrade.txt
      - name: LunaTrade tests
        run: python -m pytest tests/lt -q
      - name: Roster + offline backtest smoke test
        run: |
          python -m lunatrade agents
          python -m lunatrade backtest --synthetic --bars 320 --warmup 200 --name ci > /tmp/bt.json
          python -c "import json; m=json.load(open('/tmp/bt.json'))['backtest']; print(m); assert m['bars'] > 0"
      - name: Migration file is up to date
        run: python -m lunatrade db sql | diff - lunatrade/memory/migrations/0001_initial.sql

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-app.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/test_kronos_regression.py') }}
      - name: Regression tests
        run: python -m pytest tests -q
      - name: Automation smoke test
        run: python -m automation.kronos_auto run --only SAMPLE_A_SHARE_5MIN
      - name: Example script smoke test
        run: MPLBACKEND=Agg python examples/prediction_example.py
      - name: Quick fine-tune smoke test
        run: python -m automation.kronos_auto finetune --config finetune_csv/configs/config_quick_cpu.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-forecast
          path: |
            outputs/latest
            outputs/prediction_example.png
